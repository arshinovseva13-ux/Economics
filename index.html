["Новая экономика",["Цифровая экономика|Данные и программы как активы.","Платформы и сетевые эффекты|Чем больше пользователей, тем ценнее.","Экономика внимания|Время человека как товар.","Искусственный интеллект|Новый фактор производства.","ИИ и рынок труда|Какие задачи заменяются, какие усиливаются.","Nvidia и чипы|Почему вычисления стали нефтью эпохи ИИ.","Anthropic и лаборатории ИИ|Модели, затраты на обучение и безопасность.","Энергетика и климат|Цена углерода и переход к чистой энергии.","Демография|Старение, рождаемость, миграция.","Будущее экономики|Базовый доход, автоматизация, новые ограничения."]],["ИИ: модели и подписки",["Подписки на ИИ: рынок за $20|Кто и сколько берёт: Claude, ChatGPT, Gemini.","Claude: всё семейство моделей|Haiku, Sonnet, Opus, Fable и закрытый Mythos.","ChatGPT: GPT-6 Astra и линейка|Рассуждающая модель, тарифы и новый интерфейс.","Gemini 4 Argon|Флагман Google: доступ и раскат.","Gemini 4 Carbon|Секретный чекпоинт, который сравнивают с Opus 5.5.","Какую подписку выбрать|Разбор по задачам и лимитам.","Подписка или API|Как устроена экономика цен на ИИ.","Новости ИИ: октябрь 2026|Что случилось у OpenAI, Google и Anthropic."]]];
const L=document.getElementById('L'),q=document.getElementById('q');let R={},O={};const T={90:'<p>В цифровой экономике главный товар — информация: программа, данные, алгоритм. У такого товара особая экономика. Первая копия стоит дорого, а каждая следующая почти бесплатна, поэтому предельные издержки близки к нулю, а выигрыш масштаба огромен.</p><p>Отсюда «победитель получает почти всё»: у лидера низкие издержки и больше данных. Статистика ВВП плохо видит бесплатные услуги — поиск, карты, видео — хотя люди ими пользуются каждый день. Нематериальный капитал (код, бренд, данные) стал важнее заводов.</p>',91:'<p>Платформа соединяет две группы: покупателей и продавцов, водителей и пассажиров, авторов и читателей. Её ценность растёт с числом участников. В сети из n человек можно образовать n(n−1)/2 связей, и число связей растёт намного быстрее числа людей. Это сетевой эффект.</p><p>Он создаёт барьеры: уйти трудно, ведь там все ваши знакомые и данные. Платформы часто субсидируют одну сторону рынка и берут деньги с другой. Регуляторы спорят, как ограничивать доминирование, не разрушая пользу от масштаба.</p>',92:'<p>В 1971 году Герберт Саймон заметил: избыток информации создаёт дефицит внимания. Сегодня внимание — самый ограниченный ресурс. Бесплатные сервисы зарабатывают на рекламе, а пользователь расплачивается временем и данными.</p><p>Алгоритмы подбирают ленту так, чтобы удержать вас дольше, потому что дольше значит прибыльнее. По обзорам, реклама появилась и в бесплатной версии ChatGPT. Вопрос для экономиста: кто платит за продукт — вы или рекламодатель? От ответа зависит, чьи интересы он обслуживает.</p>',93:'<p>ИИ — технология общего назначения, как электричество или паровой двигатель. Для его производства нужны три фактора: вычисления, данные и алгоритмы. Главная статья затрат — вычислительные мощности: по оценке одного обзора, только крупнейшие облачные компании тратили на инвестиции больше 130 млрд долларов за квартал.</p><p>Эффект на производительность пока спорен. В 1987 году Роберт Солоу сказал: компьютеры видны везде, кроме статистики производительности. С ИИ может повториться: сначала инвестиции, потом перестройка процессов, и только затем рост. Цена «единицы интеллекта» падает быстро, а значит, меняется то, что выгодно автоматизировать.</p>',94:'<p>Экономисты анализируют не профессии, а задачи. Автоматизация вытесняет рутинные задачи, но создаёт новые и повышает ценность того, что остаётся человеку. Классический пример — банкоматы: они не уничтожили кассиров, а сместили их к консультированию.</p><p>ИИ впервые массово затрагивает когнитивную работу: тексты, код, анализ. Особенно уязвимы начинающие, чьи задачи проще всего автоматизировать. Данные пока неоднозначны, спор идёт между «усиление» и «замена». Выигрывают те, кто умеет ставить задачи ИИ и проверять результат. Задача политики — переобучение и смягчение переходного периода.</p>',95:'<p>Nvidia превратилась из игровой компании в главного поставщика «лопат» для золотой лихорадки ИИ. В финансовом 2020 году игры давали больше половины выручки, а центры обработки данных только 27%. Сегодня на дата-центры приходится более 90%. За квартал по июль 2026 года (II кв. финансового 2027 года) выручка составила около 96,2 млрд долларов, на 106% больше год к году, причём 89,0 млрд принёс дата-центр. Валовая маржа около 75%.</p><p>Преимущество не только в чипах, но и в программной среде CUDA и сетях NVLink, из-за которых клиентам трудно уйти. Риски: зависимость от нескольких крупных покупателей, собственные чипы облачных гигантов и экспортные ограничения: прогноз компании не включает вычислительную выручку дата-центров из Китая. Рыночная капитализация сейчас порядка 5,5 трлн долларов по сводкам. В сентябре 2025 года Nvidia и OpenAI подписали письмо о намерениях на 10 ГВт систем; критики видят в таких сделках «круговое финансирование».</p>',96:'<p>Anthropic — создатель Claude (и этого ассистента, так что читайте абзац критично). Компания основана в 2021 году Дарио и Даниэлой Амодеи. Её годовая выручка по run rate, по данным компании и СМИ, выросла с примерно 9 млрд долларов в конце 2025 года до 47 млрд в мае 2026 года и более 65 млрд в июле. Это один из самых быстрых темпов в истории софтверного бизнеса.</p><p>В мае 2026 года Anthropic привлекла 65 млрд долларов при оценке 965 млрд, а 1 июня, как сообщалось, конфиденциально подала заявку на IPO. По данным СМИ, ожидания по выручке на 2028 год — 190–200 млрд долларов. Обратная сторона: колоссальные расходы на вычисления, а рекордные оценки держатся на ожиданиях роста. Цифры по частным компаниям неточны и быстро устаревают.</p><p>Экономика лаборатории ИИ проста и жестока: обучение модели стоит огромных денег единожды, но работа каждого запроса (инференс) стоит постоянно. Победа зависит от того, кто быстрее окупит вычисления.</p>',97:'<p>ИИ потребляет много электричества. По оценке Международного энергетического агентства (2025), дата-центры мира использовали около 415 ТВт·ч в 2024 году, около 1,5% глобального потребления, и к 2030 году спрос может вырасти до примерно 945 ТВт·ч. Для сравнения, это потребление целой крупной страны.</p><p>Напряжение между климатом и ИИ очевидно. Ответ: дешёвая солнечная и ветровая энергия (стоимость солнечных панелей за десятилетие упала примерно на порядок), атомная генерация, цена на углерод и эффективность чипов. Экономисты считают самым дешёвым инструментом цену на выбросы: она заставляет искать самые дешёвые способы сократить их.</p>',98:'<p>Мир стареет. Население Земли превысило 8 млрд, и, по прогнозам ООН, пик в районе 10,3 млрд придётся на 2080-е годы. Рождаемость в мире около 2,2 ребёнка на женщину, чуть выше порога воспроизводства 2,1, но в Южной Корее около 0,7, один из самых низких показателей в мире.</p><p>Последствия: на каждого пенсионера работает всё меньше людей, давление на бюджеты и пенсии, дефицит работников. Ответы: повышение пенсионного возраста, миграция, рост производительности и автоматизация. В этом смысле ИИ и демография тесно связаны: ИИ может компенсировать нехватку рабочих рук, но не решает проблему пенсионных систем сам по себе.</p>',99:'<p>Что дальше? Экономисты рассматривают несколько сценариев. Если ИИ резко повысит производительность, главный вопрос — распределение выгод. Идея безусловного базового дохода проверялась в экспериментах: в Финляндии в 2017–2018 годах выплаты слабо повлияли на занятость, но улучшили самочувствие получателей. Другие предлагают сокращение рабочей недели и налоги на капитал.</p><p>Новые ограничения — вычисления, энергия и доверие к институтам. Вы прошли весь курс: от дефицита и выбора до ИИ-экономики. Главный вывод остаётся прежним: ресурсов всегда не хватает, и выбор между ними определяет, как живёт общество. Теперь вы умеете задавать правильные вопросы: кто платит, какие стимулы и что мы упускаем?</p>',80:'<p>«Богатство народов» (1776) Адама Смита утверждает: разделение труда резко повышает производительность (знаменитый пример — булавочная мануфактура). Рынок направляет личный интерес на общую пользу, как будто «невидимой рукой». Государству Смит оставлял оборону, правосудие и общественные работы.</p><p>Он не был певцом жадности: ещё в 1759 году написал «Теорию нравственных чувств» о сочувствии как основе общества.</p>',81:'<p>Давид Рикардо разработал теорию ренты и сравнительного преимущества. Томас Мальтус в 1798 году предсказал, что население растёт быстрее производства пищи и нищета неизбежна. Прогноз не сбылся: технологии резко подняли урожайность.</p><p>Но именно из-за мрачных выводов классиков Томас Карлейль назвал экономику «мрачной наукой».</p>',82:'<p>«Капитал» Маркса (1867) объясняет прибыль как «прибавочную стоимость», выжатую из труда, и предрекает кризисы и классовую борьбу. Трудовая теория стоимости была отвергнута маржиналистами, а предсказания о крахе капитализма не сбылись.</p><p>Но анализ циклов, неравенства и роли технологий остаётся влиятельным, а споры о Марксе не утихают.</p>',83:'<p>Альфред Маршалл в «Принципах экономики» (1890) собрал привычный нам набор: кривые спроса и предложения, эластичность, излишек потребителя, понятие предельной полезности. Он показал, что цену определяют обе стороны, как лезвия ножниц.</p><p>Благодаря ему микроэкономика стала строгой наукой с графиками, а Кембридж — её центром.</p>',84:'<p>«Общая теория занятости, процента и денег» Кейнса (1936) утверждает: уровень занятости определяет совокупный спрос, а рынок сам может застрять в депрессии. Выход — активная политика: государственные расходы и низкие ставки.</p><p>Знаменитое «в долгосрочной перспективе мы все мертвы» — вызов тем, кто советовал просто ждать. Кейнс участвовал и в создании Бреттон-Вудской системы.</p>',85:'<p>Фридрих Хайек доказывал: знание рассеяно среди миллионов людей, и цены — способ передать его без центрального планирования. Поэтому плановая экономика не справляется с задачей, а вмешательство ведёт к непредвиденным последствиям («Дорога к рабству», 1944).</p><p>Нобелевскую премию он получил в 1974 году. Его спор с Кейнсом о роли государства продолжается до сих пор.</p>',86:'<p>Милтон Фридман — лидер монетаризма: инфляция всегда и везде денежное явление, и денежную массу нужно увеличивать по строгому правилу. Нобель 1976 года, книга «Капитализм и свобода» и сильное влияние на политику 1980-х.</p><p>Критики напоминают, что денежные агрегаты оказались нестабильными, и центробанки перешли к управлению ставкой и ожиданиями.</p>',87:'<p>Йозеф Шумпетер ввёл «созидательное разрушение»: новые технологии уничтожают старые отрасли и создают новые, а двигают всё предприниматели-новаторы. Временная монополия может быть наградой за инновацию.</p><p>Он считал, что капитализм подточит собственный успех через бюрократизацию. Сегодня на него ссылаются, обсуждая платформы и искусственный интеллект.</p>',88:'<p>Теория игр изучает стратегические решения, где результат зависит от действий других. Основу заложили фон Нейман и Моргенштерн в 1944 году, а Джон Нэш определил равновесие: никому не выгодно менять стратегию в одиночку.</p><p>Дилемма заключённого объясняет картели и гонку вооружений, а аукционы и переговоры строятся по её правилам. Нобелевскую премию 1994 года получили Нэш, Харсаньи и Зельтен.</p>',89:'<p>Даниэль Канеман и Амос Тверски показали, что люди ошибаются предсказуемо: потери ощущаются сильнее выигрышей (теория перспектив), решения зависят от формулировки и «якорей». Канеман получил Нобелевскую премию 2002 года, Ричард Талер — 2017 года.</p><p>Талер предложил «подталкивание» (nudge): например, автоматическое включение в пенсионный план. Вывод: хорошая политика учитывает не идеального человека, а настоящего.</p>',70:'<p>Страны торгуют, потому что у них разные ресурсы, технологии и вкусы. Торговля расширяет выбор, снижает цены, даёт эффект масштаба и усиливает конкуренцию.</p><p>Выигрыш распределяется неравномерно: потребители и экспортёры в плюсе, а производители, конкурирующие с импортом, и их работники могут проиграть. В сумме выгода больше потерь, но компенсировать проигравших и помогать им переучиваться должна политика.</p>',71:'<p>Давид Рикардо в 1817 году показал: торговать выгодно, даже если одна страна лучше другой во всём. Важны не абсолютные затраты, а альтернативные: специализироваться нужно там, где упущенная выгода меньше.</p><p>Пример из жизни: адвокат печатает быстрее секретаря, но выгоднее нанять секретаря, а самому вести дела. Идея объясняет, почему торгуют и богатые, и бедные страны.</p>',72:'<p>Пошлина — налог на импорт. Она защищает отрасль, поднимая цену ввозимого товара, но покупатели платят больше, а общество теряет часть выгоды (мёртвый груз). Страны отвечают ответными пошлинами, и начинается торговая война.</p><p>Аргументы «за»: защита молодых отраслей, безопасность, ответ на демпинг. Закон Смута — Хоули 1930 года в США многие экономисты считают ошибкой, которая усугубила Великую депрессию.</p>',73:'<p>Глобализация — рост связей между странами через торговлю, капитал, людей и информацию. Её разогнали контейнерные перевозки с 1950-х годов, дешёвая связь, интернет и снижение пошлин.</p><p>Она помогла сотням миллионов людей выйти из бедности, особенно в Азии. Цена: потеря рабочих мест в отдельных отраслях, неравенство, зависимость от дальних поставщиков. После пандемии и санкций всё чаще говорят о фрагментации мировой экономики.</p>',74:'<p>Валютный курс — цена одной валюты в другой. Режимы бывают плавающими, фиксированными и управляемыми. «Невозможная троица»: нельзя одновременно иметь фиксированный курс, свободное движение капитала и самостоятельную денежную политику.</p><p>Девальвация помогает экспортёрам, но удорожает импорт. На курс влияют ставки, инфляция, торговый баланс и настроения инвесторов, а потому он часто колеблется сильнее, чем кажется оправданным.</p>',75:'<p>Платёжный баланс — учёт всех сделок страны с миром. Текущий счёт включает торговлю товарами и услугами, доходы и переводы, финансовый — движение капитала. Они уравновешивают друг друга: дефицит текущего счёта покрывается притоком капитала.</p><p>Дефицит не всегда плох: он может отражать инвестиции в рост. Опасно, когда он держится на коротких внешних долгах: при уходе инвесторов возникает валютный кризис.</p>',76:'<p>Бреттон-Вудская конференция 1944 года создала МВФ и Всемирный банк, а ВТО в 1995 году сменила ГАТТ. МВФ даёт кредиты при валютных кризисах и ставит условия, Банк финансирует развитие, ВТО задаёт правила торговли и разбирает споры.</p><p>Критика: жёсткие условия кредитов, неравенство в голосах и слабость механизма разрешения споров в ВТО, где апелляционный орган с 2019 года не работает.</p>',77:'<p>Почему одни страны богаты, а другие бедны? Версии: география, культура, накопление капитала и образования, институты. Аджемоглу, Джонсон и Робинсон получили Нобелевскую премию 2024 года за исследования роли институтов.</p><p>«Азиатские тигры» росли на экспорте, образовании и высоких сбережениях. Ловушки развития: слабое управление, конфликты и зависимость от сырья («ресурсное проклятие»), когда доходы от недр подрывают другие отрасли.</p>',78:'<p>Производство давно разбито по странам: сложное устройство собирают из деталей, сделанных в десятках мест. Это снижает издержки, но делает систему хрупкой. Пандемия 2020 года, дефицит чипов и блокировка Суэцкого канала в 2021 году показали цену такой экономии.</p><p>Ответ: больше поставщиков, запасы, перенос производства ближе к дому. Устойчивость стоит денег, и издержки в итоге ложатся на цены.</p>',79:'<p>Санкции — экономическое давление: запрет торговли, заморозка активов, финансовые и технологические ограничения. Их результативность спорна: цели достигаются реже, чем ожидают, и многое зависит от широты коалиции, наличия альтернатив и времени.</p><p>Издержки несёт и страна, вводящая санкции, а обходные схемы появляются быстро. Всё чаще применяют экспортный контроль на передовые технологии, и торговля становится частью безопасности.</p>',60:'<p>Налоги финансируют государство и перераспределяют доходы. Прямые облагают доходы и прибыль, косвенные (НДС, акцизы) заложены в цену товаров. Ставки бывают пропорциональными, прогрессивными и регрессивными. Адам Смит требовал справедливости, определённости, удобства и дешевизны сбора.</p><p>Налог искажает решения и создаёт «мёртвый груз», поэтому ищут баланс. Кривая Лаффера утверждает, что слишком высокая ставка может снижать поступления, но где находится пик, экономисты спорят до сих пор.</p>',61:'<p>Госбюджет — план доходов и расходов государства. Если расходы больше доходов, это дефицит, если меньше — профицит. Структурный дефицит существует и в хорошие годы, циклический возникает из-за спада: налоги падают, а пособия растут автоматически.</p><p>Главные статьи расходов: соцобеспечение, оборона, образование, здравоохранение и проценты по долгу. Бюджетные правила ограничивают расходы заранее. Бюджет — это не бухгалтерия, а выражение приоритетов общества.</p>',62:'<p>Государственный долг — накопленные дефициты. Его измеряют в долях ВВП. Долг устойчив, если экономика растёт быстрее, чем ставка по долгу. Риски появляются при росте ставок, потере доверия инвесторов и в крайнем случае при дефолте.</p><p>Долг в своей валюте безопаснее долга в иностранной, ведь центробанк может выступить покупателем. Рейнхарт и Рогофф связывали долг выше 90% ВВП с замедлением роста, но коллеги нашли в расчётах ошибки и оспорили порог. Единой «опасной цифры» нет.</p>',63:'<p>Фискальная политика — управление спросом через налоги и расходы. В спад государство стимулирует: тратит больше или снижает налоги. В перегрев сдерживает. Автоматические стабилизаторы (пособия по безработице, прогрессивные налоги) работают без новых решений.</p><p>Проблемы: запаздывание мер, вытеснение частных инвестиций и политические циклы. По теории рикардианской эквивалентности люди откладывают деньги в ожидании будущих налогов, и эффект стимула слабее. Результат зависит от мультипликатора и ожиданий.</p>',64:'<p>Регулирование исправляет провалы рынка: внешние эффекты, монополии, нехватку информации. Формы разные: стандарты, лицензии, запреты и ценовой контроль. Цена хорошего регулирования — бюрократия и издержки для бизнеса.</p><p>Джордж Стиглер описал «захват регулятора»: отрасль подчиняет себе надзорный орган и использует правила против конкурентов. Хорошая практика — ясные цели, сравнение издержек и выгод и регулярный пересмотр правил.</p>',65:'<p>Антимонопольная политика защищает конкуренцию: запрещает картели, проверяет слияния и ограничивает злоупотребление доминирующим положением. Исторические вехи — закон Шермана 1890 года и разделение Standard Oil в 1911 году.</p><p>Сегодня главный вопрос — цифровые платформы. Сетевые эффекты делают крупных игроков сильнее, а услуги часто бесплатны. Как измерять вред, если цена нулевая? Регуляторы ищут ответы в данных, доступе к платформам и защите от поглощений.</p>',66:'<p>Общественные блага неисключаемы и неконкурентны: оборона, маяки, чистый воздух. Каждому выгодно не платить, пока платят другие (проблема безбилетника), поэтому частный рынок их недопроизводит, и их финансирует государство через налоги.</p><p>Есть смешанные блага и общие ресурсы. Элинор Остром, лауреат Нобелевской премии 2009 года, показала, что сообщества часто сами управляют общими ресурсами, без государства и без частной собственности, если правила понятны и соблюдаются.</p>',67:'<p>Соцобеспечение включает пенсии, пособия, здравоохранение и образование. Пенсии бывают распределительными (нынешние работающие платят пенсионерам) и накопительными (человек копит сам). Современное социальное страхование началось с реформ Бисмарка в 1880-х годах.</p><p>Дилемма: щедрая поддержка помогает уязвимым, но может ослаблять стимул работать. Старение населения давит на системы: работающих становится меньше относительно пенсионеров, и страны повышают возраст выхода на пенсию или меняют формулы.</p>',68:'<p>Приватизация — передача государственных активов частным владельцам. Аргумент: конкуренция и частные стимулы повышают эффективность. Риски: продажа слишком дёшево, частная монополия вместо государственной и ухудшение доступа к услугам.</p><p>Опыт Великобритании 1980-х и стран бывшего СССР в 1990-х показывает, что результат зависит не только от смены собственника, но и от конкуренции, правил и качества институтов. Приватизация без них может только сменить владельца монополии.</p>',69:'<p>Субсидии, кредиты и льготы для отдельных отраслей называют промышленной политикой. Её оправдывают внешними эффектами (инновации), защитой молодых отраслей и безопасностью. Многие экономисты считают успешными примерами Южную Корею и Тайвань.</p><p>Провалы тоже известны: государство поддерживает неэффективных «любимчиков» и не умеет вовремя прекратить помощь. Сегодня поддержку получают полупроводники и чистая энергия. Работает схема с лимитом по времени, конкуренцией и измеримым результатом.</p>',0:'<p>Экономика начинается с простого факта: желания людей, фирм и государств безграничны, а время, деньги, земля и труд ограничены. Эту нехватку называют дефицитом. Он есть даже у богатых: у миллиардера не хватает часов в сутках.</p><p>Раз всего не хватает, приходится выбирать: на что потратить зарплату, куда направить завод, какую школу построить. Экономика изучает, как общества принимают такие решения и к чему они приводят. Цена, очередь, налог — всё это способы распределить то, чего мало.</p>',1:'<p>Каждый выбор означает отказ от чего-то другого. Альтернативные издержки — это ценность лучшего из отвергнутых вариантов. Час перед сериалом стоит не «ноль рублей», а то, что вы могли бы заработать или выучить за это время.</p><p>Идея объясняет многое: почему студенты учатся вместо работы, почему фермер сажает пшеницу, а не кукурузу, почему государство не может построить всё сразу. Бесплатного выбора не бывает, бывает выбор, цену которого не заметили.</p>',2:'<p>В классической модели человек рационален: он знает свои цели, сравнивает выгоды с затратами и выбирает лучшее. Это не значит, что он всё знает и никогда не ошибается, лишь то, что его выбор последователен.</p><p>Модель удобна, потому что даёт предсказания: если цена выросла, покупают меньше. Реальные люди спешат и поддаются эмоциям, и поведенческая экономика уточняет модель, а не отменяет её. Для миллионов людей сразу рациональность остаётся хорошим приближением.</p>',3:'<p>Люди реагируют на стимулы: награды, штрафы, цены, правила. Если изменить выгоду от действия, поведение обычно меняется. Это основа почти любого экономического анализа.</p><p>Стимулы работают и там, где их не ждут. В израильских детсадах ввели штраф за опоздание родителей, и опозданий стало больше: плата превратила неловкость в обычную услугу. Поэтому при создании законов, зарплатных систем и налогов нужно спрашивать, что люди начнут делать на самом деле.</p>',4:'<p>Экономисты смотрят не на «всё или ничего», а на следующий шаг. Предельная выгода — то, что даст ещё одна единица, предельные издержки — во что она обойдётся. Пока выгода больше издержек, действовать выгодно; когда они сравняются, пора остановиться.</p><p>Поэтому первый стакан воды в жару ценен, а десятый почти нет. Так фирма решает, сколько выпускать, а студент — сколько часов готовиться. Тот же подход объясняет парадокс воды и алмазов: вода необходима, но дешева, потому что её много.</p>',5:'<p>Позитивная экономика описывает факты и причины: «повышение налога на сигареты снижает курение». Такое утверждение проверяется данными. Нормативная экономика говорит, что следует делать: «налог нужно повысить». Здесь вступают в силу ценности.</p><p>Различать их важно: спор о фактах решают исследования, спор о ценностях решают политика и мораль. Хороший экономист показывает последствия вариантов, а выбор между справедливостью и эффективностью остаётся за обществом.</p>',6:'<p>Экономика слишком сложна, чтобы описывать её целиком, поэтому строят модели: упрощённые схемы, где оставлены главные связи. Карта метро не показывает дома и улицы, но именно поэтому по ней удобно ехать.</p><p>Модель опирается на допущения, например что при прочих равных спрос падает с ростом цены. Её проверяют данными и отбрасывают, если она не работает. Опасно принимать модель за реальность и забывать, где её допущения нарушаются.</p>',7:'<p>Любое общество отвечает на три вопроса: что производить, как и для кого. В рыночной системе ответ дают цены и частная собственность, в плановой — государственные планы. Чаще всего встречается смешанная система, где рынок и государство делят роли.</p><p>Рынок эффективно собирает рассеянную информацию, но оставляет неравенство и плохо обеспечивает общие блага. Планирование обещает контроль, но сталкивается с нехваткой знаний и стимулов. Реальные страны различаются долей государства, а не выбором «или-или».</p>',8:'<p>Если плоды труда может отнять сильный или чиновник, вкладываться бессмысленно. Права собственности — защищённое законом право владеть, пользоваться и продавать имущество. Они делают возможными кредиты, инвестиции и долгие планы.</p><p>Исторически богатели страны, где собственность и контракты надёжно защищает суд. Там, где права размыты, возникает трагедия общин: общее пастбище выедается, потому что каждому выгодно брать больше. Чёткие правила сохраняют и ресурсы, и мотивацию.</p>',9:'<p>Институты — формальные и неформальные правила, по которым живёт общество: законы, суды, нормы доверия, избирательная система. Дуглас Норт назвал их правилами игры: они определяют, какие стимулы получают люди.</p><p>Одинаковые ресурсы дают разный результат при разных институтах. Север и Юг Корейского полуострова начинали с близких условий, а сегодня различаются в десятки раз по доходам. Поэтому рост объясняют не только капиталом и технологиями, но и тем, поощряют ли институты созидание, а не захват.</p>',10:'<p>Закон спроса: при прочих равных чем выше цена, тем меньше люди готовы покупать. Кривая спроса показывает, сколько товара купят при каждой цене, то есть выражает готовность платить.</p><p>Кривая сдвигается, когда меняются доходы, вкусы, цены заменителей и дополняющих товаров, ожидания или число покупателей. Важно различать движение вдоль кривой (изменилась цена) и сдвиг самой кривой (изменилось что-то другое). Это различие объясняет большинство рыночных ситуаций.</p>',11:'<p>Закон предложения: чем выше цена, тем больше продавцов готовы производить, ведь прибыль растёт и покрывает возрастающие издержки. Кривая предложения показывает, сколько товара выставят при каждой цене.</p><p>Её сдвигают технологии, цены сырья и труда, налоги, субсидии и число производителей. В краткосрочном периоде предложение ограничено мощностями, в долгосрочном оно гибче: можно построить завод или выйти с рынка. Поэтому цены сильнее скачут, когда быстро нарастить выпуск невозможно.</p>',12:'<p>Равновесная цена — та, при которой количество, которое хотят купить, совпадает с количеством, которое хотят продать. Если цена выше, возникает избыток и продавцы снижают её. Если ниже, возникает дефицит и цена растёт. Так рынок сам находит баланс.</p><p>Когда государство фиксирует цену ниже равновесной (потолок, например на аренду), появляется дефицит и очереди. Когда выше (минимальная цена), появляется избыток. Любой сдвиг спроса или предложения смещает равновесие, и это основной инструмент анализа рынков.</p>',13:'<p>Эластичность показывает, на сколько процентов изменится спрос при изменении цены на один процент. Спрос эластичен, если у товара много заменителей или он не первой необходимости, и неэластичен для соли, лекарств или бензина в краткосрочном периоде.</p><p>Если спрос неэластичен, повышение цены увеличивает выручку, если эластичен — уменьшает. Эластичность определяет и то, кто на самом деле платит налог: бремя ложится на менее гибкую сторону рынка, будь то покупатель или продавец. Бывает также эластичность по доходу и перекрёстная.</p>',14:'<p>Излишек потребителя — разница между максимальной ценой, которую человек готов заплатить, и фактической. Излишек производителя — разница между ценой и издержками. Вместе они измеряют общую выгоду от сделок.</p><p>Налоги, пошлины, потолки цен и монополия уменьшают этот общий излишек. Потерянная часть называется чистыми потерями, или «мёртвым грузом»: это сделки, которые были бы выгодны обеим сторонам, но не состоялись. С помощью этой идеи экономисты оценивают, во что обществу обходится вмешательство в рынок.</p>',15:'<p>Постоянные издержки (аренда, оборудование) не зависят от объёма выпуска, переменные (сырьё, зарплаты) растут вместе с ним. Предельные издержки — стоимость производства ещё одной единицы. Обычно они сначала падают, а затем растут из-за убывающей отдачи.</p><p>Эффект масштаба делает крупное производство дешевле в расчёте на единицу, пока управлять гигантом не становится слишком сложно. И ещё одно правило: безвозвратные издержки, то есть уже потраченные и невозвратимые деньги, не должны влиять на решение. Думать нужно о будущих затратах и выгодах.</p>',16:'<p>Совершенная конкуренция предполагает много мелких фирм, одинаковый товар и свободный вход на рынок. Цену никто не контролирует, её задаёт рынок, поэтому фирма выпускает столько, чтобы предельные издержки сравнялись с ценой.</p><p>Если прибыль высока, приходят новые игроки и цена падает, поэтому в долгосрочном периоде экономическая прибыль стремится к нулю. Идеал встречается редко: ближе всего к нему сельхозтовары и биржевые активы. Но он служит ориентиром: здесь цена равна издержкам, а ресурсы используются эффективно.</p>',17:'<p>Монополист — единственный продавец, которому мешают конкуренты только барьеры входа: патенты, контроль над ресурсом, сетевые эффекты или естественная монополия, когда одна фирма обслуживает рынок дешевле нескольких (например, электросети).</p><p>Монополия ограничивает выпуск и ставит цену выше предельных издержек, из-за чего общество теряет часть выгоды. Ответы государства: регулирование цен, антимонопольные законы, разделение компаний. Но временная монополия патента одновременно поощряет изобретения, так что вопрос не так однозначен.</p>',18:'<p>В олигополии несколько крупных фирм, и каждая учитывает реакцию соперников. Если фирмы договорятся поддерживать высокие цены (картель), всем выгодно, но каждой по отдельности выгодно нарушить договорённость. Это классическая дилемма заключённого.</p><p>Поэтому картели нестабильны, а рынки олигополий полны ценовых войн, рекламы и стремления выделить продукт. Примеры — авиакомпании, операторы связи, производители чипов. Прямой сговор о ценах запрещён во многих странах, а регуляторы следят за слияниями.</p>',19:'<p>Внешние эффекты — выгоды или издержки сделки, которые достаются третьим лицам и не отражены в цене. Негативный пример — загрязнение, позитивный — прививка, образование, фундаментальная наука.</p><p>Рынок производит слишком много вредного и слишком мало полезного. Решения: налог Пигу на загрязнителей, субсидии, квоты и торговля правами на выбросы. По Рональду Коузу, если права чётко определены, а переговоры дёшевы, стороны могут договориться без государства.</p>',20:'<p>Труд — необычный товар: продавец неотделим от того, что продаёт. Спрос на труд производный: фирма нанимает, пока работник приносит больше, чем стоит. Зарплата определяется спросом и предложением, но ещё законами, традициями и тем, кто что знает о кандидате.</p><p>Рынок труда делится на сегменты: профессии, регионы, формальный и неформальный сектор. Между ними не всегда легко перейти, поэтому один и тот же навык может стоить по-разному. Дискриминация и низкая мобильность тоже искажают картину.</p>',21:'<p>Человеческий капитал — знания, навыки и здоровье, в которые вкладывают время и деньги. Образование повышает производительность и зарплату, но окупается годами. Эту идею развил Гэри Беккер.</p><p>Обучение бывает общим (пригодится у любого работодателя) и специфическим (нужно только в одной фирме). За первое обычно платит сам работник, за второе фирма. Есть и теория сигнала: диплом отчасти доказывает способности, а не только добавляет знания. Образование приносит выгоду и обществу: меньше преступности, больше инноваций.</p>',22:'<p>Безработный — тот, кто хочет и ищет работу, но не находит. Фрикционная безработица возникает при поиске между местами, структурная — когда навыки не совпадают со спросом, циклическая — из-за спада в экономике. Первые два вида образуют естественный уровень.</p><p>Статистика обманчива: если люди отчаялись и перестали искать, они выпадают из рабочей силы, и безработица падает, хотя дела не лучше. Цена безработицы — не только потерянный доход: утрачиваются навыки, растут стресс и бедность семей.</p>',23:'<p>Профсоюзы объединяют работников, чтобы вести коллективные переговоры. Они могут повышать зарплаты и улучшать условия труда для своих членов. Критики отмечают, что слишком высокая ставка способна сокращать число рабочих мест и отгораживать работающих от безработных.</p><p>Сила профсоюзов зависит от законов и отрасли: в Скандинавии они часть согласованной модели рынка труда, в других странах слабее. Забастовка — главный инструмент давления. Автоматизация и платформенная занятость ослабили прежние формы организации, и профсоюзы ищут новые.</p>',24:'<p>Зачем нужны компании, если есть рынок? Рональд Коуз ответил: пользоваться рынком дорого. Приходится искать партнёров, договариваться, контролировать исполнение. Внутри фирмы работой руководит менеджер, и это иногда дешевле.</p><p>Фирма растёт, пока издержки управления внутри не сравняются с издержками рынка снаружи. Главная проблема — конфликт интересов: менеджер (агент) не всегда действует в интересах владельцев (принципалов). Ограниченная ответственность позволила собирать капитал и рисковать, не теряя личного имущества.</p>',25:'<p>Бухгалтерская прибыль — выручка минус явные расходы. Экономическая прибыль вычитает ещё и альтернативные издержки: время и капитал владельца, которые могли бы заработать в другом месте. Положительная экономическая прибыль значит, что бизнес действительно лучше альтернативы.</p><p>Прибыль работает как сигнал и награда: она говорит, куда направлять ресурсы, и вознаграждает за риск и новаторство (Найт, Шумпетер). Убыток сигнализирует уйти. В условиях конкуренции экономическая прибыль со временем стремится к нулю, а постоянно высокая часто указывает на барьеры для конкурентов.</p>',26:'<p>Капитал — это средства производства: станки, здания, программы. Процент — цена времени: деньги сегодня ценнее, чем завтра. Ставка процента уравнивает желание сберегать и желание инвестировать.</p><p>Дисконтирование переводит будущие доходы в сегодняшние: чем выше ставка, тем меньше они стоят. Проект стоит запускать, если его приведённая стоимость больше затрат. Накопление капитала повышает производительность труда, а значит, и зарплаты, это одна из основ экономического роста.</p>',27:'<p>Рента — доход владельца ресурса, предложение которого ограничено, например земли. Земля не создаётся трудом, поэтому её цена определяется спросом. Эту идею разработал Давид Рикардо.</p><p>В широком смысле экономическая рента — плата сверх минимально необходимой: так зарабатывает звёздный футболист. Опасна рентоориентированная деятельность, когда фирмы тратят силы не на создание ценности, а на получение привилегий: лицензий, квот, защитных пошлин. Налог на землю считается удачным, потому что почти не искажает поведение.</p>',28:'<p>Неравенство описывает, как распределены доходы и богатство. Чаще всего его измеряют коэффициентом Джини: от нуля (полное равенство) до единицы (всё у одного). Причины — образование, навыки, наследство, технологии, институты и глобализация.</p><p>Умеренное неравенство даёт стимулы работать и рисковать, но сильное подрывает доверие и социальную мобильность. Меры: прогрессивные налоги, трансферты, доступное образование. Спор идёт о балансе между эффективностью и справедливостью. Томас Пикетти привлёк внимание к тому, что доход на капитал может расти быстрее экономики.</p>',29:'<p>Абсолютная бедность означает, что человек не может позволить себе базовые потребности; для сравнения стран Всемирный банк использует международную черту крайней бедности. Относительная бедность — доход ниже определённой доли медианного в своей стране.</p><p>Причины: низкая производительность, безработица, слабые институты и ловушки бедности, когда плохое здоровье и образование мешают вырваться. Помогают экономический рост, прямые денежные трансферты, школа и здравоохранение, доступ к рынкам и кредитам. За последние десятилетия число крайне бедных сильно сократилось, прежде всего благодаря росту в Азии.</p>',30:'<p>Валовой внутренний продукт — рыночная стоимость всех конечных товаров и услуг, произведённых в стране за период. Его считают тремя способами: по расходам (потребление, инвестиции, госрасходы, чистый экспорт), по доходам и по добавленной стоимости. Номинальный ВВП измеряют в текущих ценах, реальный очищен от инфляции.</p><p>Показатель не учитывает домашний труд, теневую экономику, ущерб природе и распределение доходов, поэтому равен не благополучию, а лишь размеру производства. Для сравнения стран чаще берут ВВП на душу населения.</p>',31:'<p>Инфляция — устойчивый рост общего уровня цен, при котором деньги теряют покупательную способность. Её измеряют индексом потребительских цен. Причины: спрос выше возможностей экономики, рост издержек (нефть, зарплаты), избыток денег и ожидания людей.</p><p>Умеренная инфляция около двух процентов считается нормой, и это цель многих центробанков. Гиперинфляция разрушительна, как в Германии 1923 года. Сильнее всего страдают те, чьи доходы не растут вместе с ценами, а выигрывают должники с фиксированной ставкой.</p>',32:'<p>Дефляция — падение общего уровня цен. Звучит приятно, но опасна: люди откладывают покупки в ожидании скидок, спрос падает, фирмы режут выпуск и зарплаты. При этом долг в деньгах остаётся прежним, а доходы уменьшаются, и бремя долга растёт.</p><p>Так было в Великую депрессию и в Японии с 1990-х годов. Центробанки борются с ней снижением ставок и покупкой активов. Есть и безобидная дефляция из-за роста производительности: электроника дешевеет, а экономика растёт.</p>',33:'<p>Экономический рост — увеличение реального ВВП, а на душу населения — рост уровня жизни. Источники: накопление капитала, больше и лучше подготовленных работников, технический прогресс. По модели Солоу, в долгой перспективе рост держится именно на технологиях.</p><p>Правило семидесяти: при росте два процента в год экономика удваивается примерно за 35 лет. Рост требует институтов, инвестиций, образования и открытости. Критики напоминают об ограниченных ресурсах и климате и о том, что рост не всегда означает развитие.</p>',34:'<p>Экономика растёт неравномерно: подъём, пик, спад, дно. Эти колебания называют деловым циклом. Их причины — шоки спроса и предложения, ожидания, кредитные циклы, новые технологии и ошибки политики. Длина циклов разная, поэтому точно предсказывать повороты почти не удаётся.</p><p>Теории спорят об объяснении: кейнсианцы видят нехватку спроса, сторонники теории реальных циклов — шоки производительности, монетаристы — колебания денег. Политика стремится сглаживать цикл, но иногда, наоборот, усиливает его.</p>',35:'<p>Рецессия — период заметного спада экономической активности. Её часто определяют как падение реального ВВП два квартала подряд, но официальные оценки смотрят и на занятость, доходы и продажи. Более глубокий и долгий спад называют депрессией.</p><p>Последствия: безработица, банкротства, падение инвестиций. Политика отвечает снижением ставок, расходами государства, поддержкой банков. Пособия по безработице работают как автоматический стабилизатор. Рецессии короче подъёмов, но оставляют шрамы: потерянные навыки и разорённые компании.</p>',36:'<p>Великая депрессия 1929–1933 годов: крах банков, дефляция и безработица, достигшая в США примерно четверти работоспособных. Нефтяные шоки 1970-х принесли стагфляцию. Азиатский кризис 1997–1998 годов был валютным. Мировой финансовый кризис 2008 года начался с ипотеки в США и обвала банков.</p><p>Общее у них: чрезмерный долг, пузыри, паника и цепная реакция. Уроки: надзор за банками, центробанк как кредитор последней инстанции, быстрая реакция политики. Пандемия 2020 года стала шоком другого рода — вынужденной остановкой экономики.</p>',37:'<p>Совокупный спрос — общий спрос на товары при каждом уровне цен: потребление, инвестиции, госрасходы и чистый экспорт. Совокупное предложение показывает, сколько производит экономика. Краткосрочно цены липкие, долгосрочно выпуск определяется ресурсами и технологиями.</p><p>Шок спроса двигает выпуск и цены в одну сторону. Шок предложения, например скачок цен на нефть, сокращает выпуск и поднимает цены — это стагфляция. Модель помогает понять причины рецессий и инфляции и выбрать меры политики.</p>',38:'<p>Рост расходов вызывает увеличение дохода больше начальной суммы: чьи-то траты — чей-то доход, который снова тратится. Величина эффекта 1/(1 − доля потребления): при доле 0,8 множитель в идеале равен пяти.</p><p>На практике он меньше из-за налогов, импорта и сбережений. Это ключевая идея Кейнса: в спад государственные расходы запускают цепочку спроса. Но спор о размере мультипликатора не утихает: при полной занятости он ниже, а госрасходы могут вытеснять частные инвестиции.</p>',39:'<p>Сначала Филлипс описал связь между безработицей и ростом зарплат, потом её перенесли на инфляцию: чем ниже безработица, тем выше инфляция. Политики решили, что можно выбирать между ними, но стагфляция 1970-х показала нестабильность связи.</p><p>Фридман и Фелпс объяснили роль ожиданий: в долгой перспективе компромисса нет, а безработица возвращается к естественному уровню. Центробанкам важно удерживать ожидания людей. В последние десятилетия связь ослабла, и экономисты до сих пор спорят о причинах.</p>',40:'<p>Деньги выполняют три функции: средство обмена, мера стоимости и способ сбережения. Они решают проблему бартера, когда нужно, чтобы потребности двух людей совпали. Хорошие деньги делимы, прочны, узнаваемы и не появляются из воздуха.</p><p>Бывают товарные (золото) и фиатные: бумажные и безналичные, которые ценны только потому, что им доверяют и что их признаёт закон. Большая часть денег сегодня — это записи на счетах в банках. Деньги — в первую очередь договорённость общества.</p>',41:'<p>Центральный банк выпускает национальную валюту, обслуживает другие банки и регулирует денежную систему. Его задачи — стабильные цены, надёжные банки и нередко занятость. Инструменты: ставка, резервные требования, операции на открытом рынке, валютные интервенции.</p><p>В кризис он становится кредитором последней инстанции. Независимость от правительства защищает от соблазна печатать деньги перед выборами. Примеры: ФРС в США, ЕЦБ в еврозоне, Банк России.</p>',42:'<p>Ключевая ставка — процент, по которому центральный банк кредитует банки, ориентир для всех остальных ставок. Когда она растёт, кредиты дорожают, спрос и инфляция снижаются, но тормозится рост. При снижении — наоборот.</p><p>Решение действует с запаздыванием в несколько месяцев, поэтому центробанк смотрит на ожидаемую инфляцию, а не на вчерашнюю. Ставка влияет и на курс валюты: высокие ставки привлекают капитал и укрепляют валюту.</p>',43:'<p>Коммерческие банки принимают вклады, выдают кредиты и обслуживают платежи. Они держат в резерве лишь часть вкладов, а остальное отдают в кредит, и выданный кредит снова оседает вкладом. Так банки создают деньги.</p><p>Прибыль банка — разница между ставками по кредитам и по вкладам. Риски: невозврат кредитов и нехватка ликвидности. Регуляторы требуют держать капитал на случай убытков. Банки переносят сбережения в инвестиции и снижают издержки поиска.</p>',44:'<p>Кредит переносит покупательную способность во времени: можно инвестировать или потреблять сейчас, а платить потом. Долг полезен, если проект приносит больше процента, и опасен при пузырях и падении доходов. Заёмщиками бывают семьи, фирмы и государства.</p><p>Рычаг (леверидж) усиливает и прибыль, и убытки. Риск невозврата входит в ставку как премия. Ирвинг Фишер описал долговую дефляцию: когда цены падают, реальный долг растёт и приглушает экономику.</p>',45:'<p>Когда ставка уже почти нулевая, центробанк покупает облигации и другие активы, создавая новые резервы для банков. Это называют количественным смягчением. Цель — снизить долгосрочные ставки и поддержать кредит. Меру применяли после 2008 года и в 2020 году.</p><p>Сторонники говорят, что это предотвратило глубокий спад. Критики видят риски: рост цен активов, неравенство, будущая инфляция и трудность выхода из политики.</p>',46:'<p>Криптовалюты — цифровые активы на блокчейне, распределённом реестре без единого оператора. Биткойн появился в 2009 году, его монет не больше 21 миллиона. Плюсы: переводы без посредника и программируемость.</p><p>Минусы: сильные колебания цены, мошенничество и расход энергии при майнинге по методу доказательства работы. В роли денег они пока ограничены. Стейблкоины привязаны к валютам, а государства разрабатывают цифровые валюты центральных банков. Регулирование в разных странах сильно отличается.</p>',47:'<p>При золотом стандарте валюту можно было обменять на фиксированное количество золота. Классический (1870–1914) давал стабильные курсы и низкую инфляцию в долгой перспективе, но жёстко ограничивал политику: в спад нельзя было печатать деньги.</p><p>Система Бреттон-Вудса (1944) привязала доллар к золоту, а остальные валюты к доллару; она распалась в 1971 году. Многие экономисты считают, что жёсткая привязка к золоту углубила Великую депрессию.</p>',48:'<p>Банковская паника начинается, когда вкладчики боятся потерять деньги и массово забирают их. Банк не может вернуть всё сразу, потому что деньги вложены в кредиты, и даже здоровый банк может рухнуть.</p><p>Защита: страхование вкладов, кредитор последней инстанции и нормативы ликвидности. Страхование снижает панику, но подталкивает банки к риску (моральный риск). В эпоху онлайн-банкинга паника распространяется за часы.</p>',49:'<p>Страхование распределяет риск: многие небольшими взносами покрывают убытки немногих. Закон больших чисел делает потери предсказуемыми. Бывает страхование жизни, имущества и ответственности, а также перестрахование.</p><p>Трудности: неблагоприятный отбор, когда полис больше нужен рискованным, и моральный риск, когда застрахованный ведёт себя неосторожнее. Ответ — франшизы, тарифы по группам риска и обязательные полисы. Страхование позволяет рисковать ради роста.</p>',50:'<p>Акция — доля в капитале компании. Она даёт право на часть прибыли (дивиденды) и голос на собрании. Курс растёт, когда инвесторы ждут роста прибыли. Компании выпускают акции, чтобы привлечь деньги без долга.</p><p>Акционер получает остаточный доход после выплат кредиторам, поэтому риск выше, чем у облигаций, как и потенциальная доходность. Если фирма обанкротится, акции могут обесцениться полностью.</p>',51:'<p>Облигация — долг: государство или компания занимает деньги, платит купон и возвращает номинал в срок. Цена облигации обратно связана со ставками: когда ставки растут, старые бумаги с низким купоном дешевеют.</p><p>Риски: дефолт эмитента, инфляция и изменение ставок. Чем выше риск, тем выше требуемая доходность. Облигации надёжных государств служат почти безрисковым ориентиром для остальных активов.</p>',52:'<p>Биржа — организованный рынок, где покупают и продают ценные бумаги. Она даёт ликвидность (быстро продать), прозрачную цену и защиту правилами. Первичное размещение (IPO) приносит деньги компании, вторичные торги переводят бумаги между инвесторами.</p><p>Индексы, например S&amp;P 500, показывают состояние рынка в целом. Сегодня торги идут электронно, и сделки занимают доли секунды.</p>',53:'<p>«Не клади все яйца в одну корзину»: разные активы не падают одновременно, и риск портфеля ниже суммы рисков его частей. Гарри Марковиц показал, что важна корреляция между активами, а не только их число.</p><p>Диверсификация убирает риск отдельной компании, но не рыночный риск. После определённого числа активов защита почти не растёт, а управлять портфелем становится сложнее.</p>',54:'<p>Гипотеза Юджина Фамы: цены отражают всю доступную информацию, поэтому системно обыгрывать рынок трудно. Практический вывод: недорогие индексные фонды после комиссий часто выигрывают у активных управляющих.</p><p>Критики указывают на ошибки инвесторов, пузыри и ограничения арбитража. Спор продолжается: в 2013 году Нобелевскую премию получили и Юджин Фама, и Роберт Шиллер, взгляды которых противоположны.</p>',55:'<p>Деривативы — инструменты, стоимость которых зависит от базового актива. Фьючерс обязывает купить или продать по оговорённой цене, опцион даёт право, но не обязанность, своп обменивает платежи.</p><p>Они нужны для хеджирования: фермер фиксирует цену урожая заранее. Но с их помощью можно и спекулировать с плечом, а значит, терять больше вложенного. В 2008 году непрозрачные деривативы усилили кризис.</p>',56:'<p>Венчурные инвесторы вкладываются в молодые компании с высоким риском и получают долю. Большинство стартапов не окупается, а несколько успешных приносят основную доходность фонда.</p><p>Раунды идут по стадиям (посевной, A, B, C), а выход происходит через IPO или продажу компании. Венчур финансирует идеи, которым банки не дают кредит из-за отсутствия залога.</p>',57:'<p>Пузырь возникает, когда цена актива сильно отрывается от его фундаментальной стоимости: люди покупают в расчёте перепродать дороже. Примеры: тюльпаномания в Голландии 1630-х, дот-ком 1999–2000 годов, ипотечный рынок США до 2008 года.</p><p>Признаки: быстрый рост, кредитное плечо, убеждение «на этот раз всё иначе». Лопаются они болезненно, а заранее отличить пузырь от оправданного роста трудно.</p>',58:'<p>Валютный рынок — крупнейший в мире, его оборот измеряется триллионами долларов в день. Курс зависит от спроса и предложения, ставок, инфляции, торгового баланса и ожиданий. Режимы бывают плавающие, фиксированные и управляемые.</p><p>Слабая валюта помогает экспортёрам, но удорожает импорт. Паритет покупательной способности утверждает, что одинаковые товары в долгосрочной перспективе должны стоить одинаково в разных странах.</p>',59:'<p>Паевой фонд собирает деньги многих инвесторов и вкладывает их в корзину активов. ETF торгуется на бирже как акция и обычно повторяет индекс с низкой комиссией.</p><p>Плюсы: диверсификация одной покупкой и низкие затраты. Минусы: комиссии активных фондов, налоги и рыночный риск. При выборе смотрите на комиссию, состав и отклонение от индекса.</p>',100:'<p>Крупные сервисы сошлись на одной цене: около $20 в месяц за основной тариф (ChatGPT Plus, Claude Pro, Google AI Pro) и $100–200 за «тяжёлые». Это не случайность: вычисления дороги, и подписка с лимитами делит людей по тому, насколько они упираются в потолок. Лёгкие пользователи фактически субсидируют тяжёлых.</p><p>ChatGPT: Free (с рекламой в США и Европе), Go $8, Plus $20, Pro $100 и $200. Claude: Free, Pro $20 ($17 при годовой оплате), Max $100 (5×) и $200 (20×). Google: AI Plus (обзоры расходятся: $5–8), AI Pro $19,99, AI Ultra $99,99 и $199,99. Цены в США по обзорам на октябрь 2026, проверяйте на сайтах.</p>',101:'<p>Лестница Claude: Haiku — быстрый и дёшевый, Sonnet — баланс, Opus — мощный. Выше стоит класс Mythos: Fable — его общедоступная версия с дополнительными защитами (биология, кибербезопасность), а Mythos доступен узкому кругу организаций.</p><p>Актуальные модели в API: Fable 5.1, Opus 5.5, Sonnet 5.5, Haiku 5.5. Fable 5 и Mythos 5 вышли 9 июня 2026, 12 июня доступ приостановили из-за экспортных ограничений США, 1 июля восстановили. Версии 5.1 появились 1 сентября. Статус делает одну модель экономической: выше класс — выше цена и строже доступ.</p>',102:'<p>GPT-6 Astra — флагманская рассуждающая модель OpenAI; на тарифе Pro доступен GPT-6 Pro на её основе. Дата дебюта в источниках расходится (весна или начало сентября 2026), поэтому точного числа я не даю. Компания TradeSun 5 октября подала иск из-за названия Astra.</p><p>7 октября OpenAI выпустила новую модель GPT-6 и Intelligent UI: чат строит интерактивные диаграммы для объяснения сложных тем. Ещё: в сентябре сообщили о плане заменить пользовательские GPT плагинами.</p>',103:'<p>Google объявил Gemini 4 Argon 30 сентября. Первыми доступ получили доверенные специалисты по кибербезопасности в программе Fairwind, затем платные API-клиенты и подписчики AI Ultra. Внутри Google он проходил как «Barium-B». Смартфонный массовый запуск на момент обзоров ещё не состоялся.</p><p>По оценкам прессы, это флагман рассуждений, сопоставимый с Opus и Astra. В приложении Gemini уже появились уровни рассуждения Low, Medium и High. Критики называют анонсы Google «слайдвером», пока модель недоступна всем.</p>',104:'<p>Carbon — внутренний чекпоинт Gemini 4, который Google тестирует на кодерской платформе Jetski. По данным Business Insider, один сотрудник говорит, что в программировании он «ощущается как Opus 5.5» и сильнее Argon.</p><p>Что неясно: станет ли Carbon обновлением Argon или отдельным релизом; Google комментариев не дала. Публичных бенчмарков нет, так что сравнение с Opus — мнение одного сотрудника, а не измерение.</p>',105:'<p>Разбор по задачам. Код и долгая работа с агентами — Claude Pro или Max. Всё в одном месте, визуалы и интеграции — ChatGPT Plus. Экосистема Google, хранилище и видео — Google AI Pro или Ultra. По бюджету есть ChatGPT Go и Google AI Plus.</p><p>Совет экономиста: платите за лимиты, не за название. Если упираетесь в потолок, берите верхний тариф этого же сервиса, а не вторую подписку. Пробуйте месяц и сравнивайте на своих задачах. Это обобщение, не финансовая рекомендация.</p>',106:'<p>Подписка — фиксированная цена за переменные издержки, API — плата за токены. Тяжёлым пользователям часто дешевле подписка, лёгким — API. Сторонние обзоры указывают для Fable 5.1 около $10 и $50 за миллион токенов (вход и выход), но эту цену лучше проверить у Anthropic.</p><p>Связь с экономикой: компании не могут безгранично дарить вычисления, поэтому подписки делятся на «версии» по лимитам (5× и 20×). Цена «безлимита» всегда с звёздочкой.</p>',107:'<p>Новости недели: 7 октября OpenAI запустила Intelligent UI; 5 октября TradeSun подала иск про имя Astra; по сообщениям прессы, OpenAI подала конфиденциальную заявку на IPO. OpenAI рассказала о кампаниях влияния с участием ChatGPT, связанных с Ираном и Россией.</p><p>Google: Argon уже у избранных, Carbon тестируется внутри. Anthropic: Fable 5.1 — актуальный релиз. Сводка на 12 октября 2026, данные меняются быстро.</p>'};
